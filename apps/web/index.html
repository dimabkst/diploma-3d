<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Інструмент для створення просторових моделей зі стереометрії" />
    <title>Стереометрія 3D</title>
    <!-- The saved theme before the first paint, so that a dark choice never flashes light; src/lib/model/theme.ts owns the key. -->
    <script>
      try {
        if (localStorage.getItem("diploma-3d.theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
